<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>为特定编辑器实例设置格式化</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.0/min/vs/loader.js"></script>
    <style>
      .editor-wrapper {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }

      .editor-container {
        width: 500px;
        height: 400px;
        border: 1px solid #ccc;
      }

      .controls {
        margin: 10px 0;
      }

      button {
        padding: 8px 16px;
        cursor: pointer;
      }

      h3 {
        margin: 10px 0;
      }
    </style>
  </head>

  <body>
    <div class="controls">
      <button id="formatEditor1">格式化编辑器 1（自定义规则）</button>
      <button id="formatEditor2">格式化编辑器 2（默认规则）</button>
    </div>

    <div class="editor-wrapper">
      <div>
        <h3>编辑器 1（有自定义格式化）</h3>
        <div id="editor1" class="editor-container"></div>
      </div>
      <div>
        <h3>编辑器 2（无自定义格式化）</h3>
        <div id="editor2" class="editor-container"></div>
      </div>
    </div>

    <script>
      require.config({
        paths: {
          vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.0/min/vs",
        },
      });
      require(["vs/editor/editor.main"], function () {
        // 创建编辑器 1（需要自定义格式化）
        const editor1 = monaco.editor.create(
          document.getElementById("editor1"),
          {
            value: 'function foo(){console.log("editor1");if(a){b();}}',
            language: "typescript",
            theme: "vs-light",
          }
        );

        // 创建编辑器 2（使用默认格式化，不受自定义影响）
        const editor2 = monaco.editor.create(
          document.getElementById("editor2"),
          {
            value: 'function bar(){console.log("editor2");if(b){c();}}',
            language: "html",
            theme: "vs-light",
          }
        );

        // 2. 为新语言 ID 注册格式化提供者（仅对编辑器 1 生效）
        monaco.languages.registerDocumentFormattingEditProvider("typescript", {
          provideDocumentFormattingEdits: function (model, options, token) {
            console.log("123123");
            const text = model.getValue();

            // 编辑器 1 的自定义格式化规则（例如：4 空格缩进）
            let formatted =
              text
                .replace(/{/g, " {\n    ")
                .replace(/}/g, "\n}")
                .replace(/;/g, ";\n    ")
                .replace(/\n\n+/g, "\n")
                .replace(/\n    }/g, "\n}")
                .replace(/if\(/g, "if (")
                .trim() + "\n";

            return [
              {
                range: model.getFullModelRange(),
                text: formatted,
              },
            ];
          },
        });

        // 绑定格式化按钮事件
        document
          .getElementById("formatEditor1")
          .addEventListener("click", function () {
            editor1.getAction("editor.action.formatDocument").run();
          });

        document
          .getElementById("formatEditor2")
          .addEventListener("click", function () {
            editor2.getAction("editor.action.formatDocument").run();
          });
      });
    </script>
  </body>
</html>
